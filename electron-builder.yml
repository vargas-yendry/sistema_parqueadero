appId: com.parqueadero.yg

# Sin el "&": AppImage rechaza ese carácter en el nombre de archivo, y en Windows
# complica rutas y accesos directos. El nombre bonito con "&" se muestra en la
# ventana y en el acceso directo de Windows (ver nsis.shortcutName).
productName: Parqueadero YG
executableName: parqueadero-yg
copyright: Parqueadero Y&G

directories:
  output: instalador
  buildResources: build

artifactName: ${name}-${version}-${arch}.${ext}

# Electron trae 55 idiomas y pesan 46 MB. Esta app es solo en español; se deja
# el inglés porque es el idioma de reserva de Chromium para sus propios textos
# (diálogos de impresión, menús del sistema).
electronLanguages:
  - es
  - es-419
  - en-US

# La interfaz ya va compilada en dist/; del código fuente solo entra lo que el
# servidor carga en caliente. Se incluye todo src/features/**/*.js (no solo
# rutas.js) porque las rutas importan módulos vecinos como salidas/cobro.js.
#
# node_modules queda fuera porque todas las dependencias ya están dentro de esos
# dos paquetes. La excepción es sqlite3: es binario nativo y no se puede
# empaquetar. Entran también sus dos dependencias de ejecución (bindings, que
# localiza el .node, y file-uri-to-path, que usa bindings); el resto de lo que
# declara sqlite3 solo se usa al instalar.
files:
  - dist/**/*
  - dist-servidor/**/*
  - desktop/**/*
  - package.json
  - "!node_modules/**"
  - node_modules/sqlite3/**/*
  - "!node_modules/sqlite3/deps/**"
  - node_modules/bindings/**/*
  - node_modules/file-uri-to-path/**/*

# El servidor corre como proceso hijo (fork) y carga un binario nativo. Desde una
# ruta desempaquetada no se puede leer hacia dentro del asar, así que el
# servidor y TODO lo que requiere en ejecución tienen que quedar fuera.
asarUnpack:
  - dist-servidor/**/*
  - node_modules/**/*

linux:
  target:
    # deb  = entregable principal: declara las dependencias del sistema e integra
    #        menú e icono como cualquier programa del equipo.
    # AppImage = plan B portátil: un archivo, sin instalar y sin administrador.
    - target: deb
      arch: [x64]
    - target: AppImage
      arch: [x64]
  category: Office
  synopsis: Sistema de parqueadero
  description: Ingresos y salidas por ficha, mensualidades, accesorios y reportes.
  maintainer: Parqueadero Y&G <murksopps@gmail.com>
  # Sin esto el escritorio no asocia la ventana abierta con su lanzador.
  syncDesktopName: true

# ─────────────────────────────────────────────────────────────────────────────
# Windows
#
# OJO: este build NO se puede hacer desde Linux. sqlite3 es un binario nativo y
# el empaquetado mete el que haya compilado para la máquina actual: desde Arch
# saldría un .node de Linux dentro del .exe y la app reventaría al abrir la base
# de datos, con el agravante de que el build "termina bien". Hay que construirlo
# en Windows. Ver docs/instalador-windows.md.
#
# Solo x64: sqlite3 6.0.1 publica únicamente el binario win32-x64 (verificado en
# sus releases), así que un build de 32 bits tendría que compilarse desde fuente
# con Visual Studio en la máquina destino.
# ─────────────────────────────────────────────────────────────────────────────
win:
  target:
    # nsis = instalador de siempre; portable = un .exe suelto que no se instala.
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

portable:
  artifactName: ${name}-${version}-portable.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Parqueadero Y&G
  uninstallDisplayName: Parqueadero Y&G ${version}
