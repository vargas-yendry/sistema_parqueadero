appId: com.parqueadero.yg

# Sin el "&": AppImage rechaza ese carácter en el nombre de archivo, y en Windows
# complica rutas y accesos directos. El nombre bonito con "&" se muestra en la
# ventana y en el acceso directo de Windows (ver nsis.shortcutName).
productName: Parqueadero YG
executableName: parqueadero-yg
copyright: Parqueadero Y&G

directories:
  output: instalador
  buildResources: build

artifactName: ${name}-${version}-${arch}.${ext}

# La interfaz ya va compilada en dist/; del código fuente solo entra lo que el
# servidor carga en caliente. Se incluye todo src/features/**/*.js (no solo
# rutas.js) porque las rutas importan módulos vecinos como salidas/cobro.js.
files:
  - dist/**/*
  - desktop/**/*
  - src/servidor/**/*
  - src/features/**/*.js
  - "!src/features/**/*.test.js"
  - package.json

# El servidor corre como proceso hijo (fork), así que debe quedar fuera del asar,
# igual que el binario nativo de sqlite3.
asarUnpack:
  - src/servidor/**/*
  - src/features/**/*.js
  - node_modules/sqlite3/**/*

linux:
  target:
    - AppImage
  category: Office
  synopsis: Sistema de parqueadero
  description: Ingresos y salidas por ficha, mensualidades, accesorios y reportes.
  # Sin esto el escritorio no asocia la ventana abierta con su lanzador.
  syncDesktopName: true

win:
  target: nsis

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Parqueadero Y&G
